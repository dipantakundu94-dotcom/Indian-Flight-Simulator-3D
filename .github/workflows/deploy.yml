name: Build Indian Flight Simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Game
        uses: actions/deploy-pages@v4
