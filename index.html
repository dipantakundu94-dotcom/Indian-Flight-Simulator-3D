DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indian Flight Simulator 3D</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#87ceeb;font-family:Arial}
#game{width:100vw;height:100vh;display:block}
#hud{
 position:absolute;top:10px;left:10px;
 color:white;background:#0009;padding:12px;
 border-radius:10px;font-size:13px;line-height:1.8;
}
#airport{
 position:absolute;top:10px;right:10px;
 padding:10px;border-radius:8px;background:#111;color:white;
}
#controls{
 position:absolute;bottom:20px;width:100%;
 display:flex;justify-content:space-between;padding:0 18px;
}
.group{display:flex;gap:8px;align-items:center}
button{
 background:#111c;color:white;border:1px solid white;
 border-radius:12px;padding:15px;font-size:16px;
 min-width:55px;touch-action:none;
}
#message{
 position:absolute;top:45%;width:100%;text-align:center;
 color:white;font-size:23px;text-shadow:2px 2px 5px black;
 pointer-events:none;
}
</style>
</head>

<body>

<div id="hud">
INDIAN FLIGHT SIMULATOR 3D<br>
Speed: <span id="speed">0</span> km/h<br>
Altitude: <span id="altitude">0</span> m<br>
Status: <span id="status">READY</span>
</div>

<select id="airport">
<option>Delhi - IGI Airport</option>
<option>Mumbai - CSMIA</option>
<option>Kolkata - Netaji Subhas Airport</option>
<option>Chennai International Airport</option>
<option>Bengaluru - Kempegowda Airport</option>
<option>Hyderabad - Rajiv Gandhi Airport</option>
<option>Goa International Airport</option>
<option>Ahmedabad Airport</option>
<option>Jaipur Airport</option>
<option>Lucknow Airport</option>
<option>Patna Airport</option>
<option>Guwahati Airport</option>
</select>

<div id="message">INDIAN FLIGHT SIMULATOR 3D</div>

<div id="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="group">
  <button id="brake">BRAKE</button>
  <button id="throttle">THROTTLE</button>
  <button id="up">▲</button>
  <button id="down">▼</button>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,300,1800);

const camera = new THREE.PerspectiveCamera(
 65,window.innerWidth/window.innerHeight,0.1,3000
);
  
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557755,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(100,200,100);
sun.castShadow=true;
scene.add(sun);

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(3000,3000),
 new THREE.MeshStandardMaterial({color:0x438b45})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-2;
ground.receiveShadow=true;
scene.add(ground);

// Runway
const runway=new THREE.Mesh(
 new THREE.BoxGeometry(35,0.5,1200),
 new THREE.MeshStandardMaterial({color:0x333333})
);
runway.position.set(0,0,-350);
runway.receiveShadow=true;
scene.add(runway);

// Runway center
